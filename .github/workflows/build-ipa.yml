name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$LATEST"
          echo "::notice::Xcode path $LATEST"
          echo "::notice::$(xcodebuild -version | head -n1) on macOS $(sw_vers -productVersion)"

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Expo prebuild (iOS)
        run: npx expo prebuild -p ios --clean

      - name: Build app without code signing
        working-directory: ios
        run: |
          set +e
          LOG="$RUNNER_TEMP/xcodebuild.log"
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "::notice::workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > "$LOG" 2>&1
          CODE=$?
          echo "xcodebuild exit code: $CODE"
          if [ $CODE -ne 0 ]; then
            REPORT=$(grep -a -m 8 "error:" "$LOG")
            if [ -z "$REPORT" ]; then REPORT=$(grep -a -m 8 -i "error" "$LOG"); fi
            if [ -z "$REPORT" ]; then REPORT=$(tail -n 8 "$LOG"); fi
            echo "$REPORT" | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::$line"; done
            {
              echo "## xcodebuild failed (exit $CODE)"
              echo '```'
              tail -n 150 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $CODE
          fi
          tail -n 30 "$LOG"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry bilgitakip-unsigned.ipa Payload
          ls -lh bilgitakip-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilgitakip-unsigned-ipa
          path: bilgitakip-unsigned.ipa
          retention-days: 30
