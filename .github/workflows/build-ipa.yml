name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Expo prebuild (iOS)
        run: npx expo prebuild -p ios --clean

      - name: Build app without code signing
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 80

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry bilgitakip-unsigned.ipa Payload
          ls -lh bilgitakip-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilgitakip-unsigned-ipa
          path: bilgitakip-unsigned.ipa
          retention-days: 30
